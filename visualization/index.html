<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Literature Paper Breaker - Research Dashboard</title>
<style>
:root {
  --bg: #0a0e17;
  --surface: #131a2b;
  --surface2: #1a2340;
  --border: #2a3558;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --accent: #6366f1;
  --accent2: #818cf8;
  --green: #22c55e;
  --yellow: #eab308;
  --orange: #f97316;
  --red: #ef4444;
  --cyan: #06b6d4;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

.container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

/* Header */
header {
  background: linear-gradient(135deg, #131a2b 0%, #1e1a3a 100%);
  border-bottom: 1px solid var(--border);
  padding: 32px 0;
}

header h1 {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(135deg, #818cf8, #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}

header p { color: var(--text2); font-size: 15px; }

.stats-bar {
  display: flex;
  gap: 32px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.stat-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent2);
}

.stat-label {
  font-size: 12px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Navigation tabs */
.tabs {
  display: flex;
  gap: 4px;
  margin: 24px 0;
  background: var(--surface);
  border-radius: 12px;
  padding: 4px;
  width: fit-content;
}

.tab {
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text2);
  transition: all 0.2s;
  border: none;
  background: none;
}

.tab:hover { color: var(--text); background: var(--surface2); }
.tab.active { color: white; background: var(--accent); }

/* Paper cards */
.papers-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

.paper-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  transition: all 0.3s;
  cursor: pointer;
}

.paper-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(99, 102, 241, 0.15);
}

.paper-card.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.paper-num {
  display: inline-block;
  background: var(--accent);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 12px;
}

.paper-card h3 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
  line-height: 1.4;
}

.paper-meta {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.meta-tag {
  font-size: 12px;
  color: var(--text2);
  background: var(--surface2);
  padding: 4px 10px;
  border-radius: 6px;
}

.paper-score {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.score-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 16px;
}

.score-good { background: rgba(34, 197, 94, 0.15); color: var(--green); border: 2px solid var(--green); }
.score-ok { background: rgba(234, 179, 8, 0.15); color: var(--yellow); border: 2px solid var(--yellow); }
.score-bad { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 2px solid var(--red); }

.score-details { flex: 1; }
.score-details .label { font-size: 13px; color: var(--text2); }
.score-details .decision { font-size: 14px; font-weight: 600; }

.decision-accept { color: var(--green); }
.decision-minor { color: var(--yellow); }
.decision-major { color: var(--orange); }
.decision-reject { color: var(--red); }

/* Detail panel */
.detail-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 32px;
  overflow: hidden;
  display: none;
}

.detail-panel.visible { display: block; }

.detail-header {
  padding: 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.detail-header h2 { font-size: 20px; font-weight: 600; }

.close-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text2);
  width: 32px;
  height: 32px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.close-btn:hover { background: var(--surface2); color: var(--text); }

.detail-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}

.detail-tab {
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}

.detail-tab:hover { color: var(--text); }
.detail-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }

.detail-content {
  padding: 24px;
  max-height: 700px;
  overflow-y: auto;
}

.detail-content::-webkit-scrollbar { width: 6px; }
.detail-content::-webkit-scrollbar-track { background: transparent; }
.detail-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Review timeline */
.review-timeline {
  position: relative;
  padding-left: 32px;
}

.review-timeline::before {
  content: '';
  position: absolute;
  left: 12px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border);
}

.timeline-item {
  position: relative;
  margin-bottom: 24px;
}

.timeline-dot {
  position: absolute;
  left: -26px;
  top: 4px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--bg);
}

.timeline-dot.round2 { background: var(--green); }
.timeline-dot.revision { background: var(--cyan); }

.timeline-label {
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

/* Reviewer card */
.reviewer-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}

.reviewer-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}

.reviewer-name {
  font-weight: 600;
  font-size: 15px;
}

.reviewer-affil {
  font-size: 12px;
  color: var(--text2);
}

.reviewer-score-badge {
  font-weight: 700;
  font-size: 18px;
  padding: 4px 12px;
  border-radius: 8px;
}

/* Score bars */
.criteria-scores {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 16px 0;
}

.criterion {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}

.criterion-name {
  width: 140px;
  color: var(--text2);
  flex-shrink: 0;
}

.criterion-bar-bg {
  flex: 1;
  height: 6px;
  background: var(--bg);
  border-radius: 3px;
  overflow: hidden;
}

.criterion-bar {
  height: 100%;
  border-radius: 3px;
  transition: width 0.8s ease-out;
}

.criterion-val {
  width: 24px;
  text-align: right;
  font-weight: 600;
  font-size: 12px;
}

/* Comments */
.comments-section {
  margin-top: 12px;
}

.comment-block {
  margin-bottom: 12px;
}

.comment-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent2);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.comment-text {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
}

.comment-list {
  list-style: none;
  padding: 0;
}

.comment-list li {
  font-size: 13px;
  color: var(--text2);
  padding: 4px 0 4px 16px;
  position: relative;
}

.comment-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 11px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.comment-list.strengths li::before { background: var(--green); }
.comment-list.weaknesses li::before { background: var(--orange); }
.comment-list.suggestions li::before { background: var(--cyan); }

/* Editor synthesis */
.editor-card {
  background: linear-gradient(135deg, #1a2340 0%, #1e1a3a 100%);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 20px;
}

.editor-card h4 {
  color: var(--accent2);
  font-size: 14px;
  margin-bottom: 12px;
}

/* Paper content display */
.paper-content {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text);
}

.paper-content h1 { font-size: 22px; margin: 24px 0 12px; color: var(--accent2); }
.paper-content h2 { font-size: 18px; margin: 20px 0 10px; color: var(--text); }
.paper-content h3 { font-size: 15px; margin: 16px 0 8px; color: var(--text2); }
.paper-content p { margin-bottom: 12px; }

/* Radar chart */
.radar-container {
  display: flex;
  justify-content: center;
  margin: 20px 0;
}

/* Score comparison */
.score-comparison {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin: 20px 0;
}

.compare-card {
  background: var(--surface2);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
}

.compare-card .round-label {
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.compare-card .round-score {
  font-size: 36px;
  font-weight: 700;
  margin: 8px 0 4px;
}

.compare-card .round-decision {
  font-size: 13px;
  font-weight: 500;
}

.arrow-improvement {
  color: var(--green);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

/* Pipeline flow */
.pipeline-flow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 24px 0;
  flex-wrap: wrap;
}

.pipeline-step {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  color: var(--text2);
}

.pipeline-step.completed { border: 1px solid var(--green); color: var(--green); }
.pipeline-step.active { border: 1px solid var(--accent); color: var(--accent2); animation: pulse 2s infinite; }

.pipeline-arrow { color: var(--border); font-size: 18px; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* Responsive */
@media (max-width: 768px) {
  .papers-grid { grid-template-columns: 1fr; }
  .criteria-scores { grid-template-columns: 1fr; }
  .stats-bar { gap: 16px; }
}

/* Markdown content rendering */
.md-content { white-space: pre-wrap; word-wrap: break-word; }

/* Loading spinner */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  color: var(--text2);
}

.spinner {
  width: 24px;
  height: 24px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Collapsible */
.collapsible-header {
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 8px;
}

.collapsible-header .chevron {
  transition: transform 0.2s;
  font-size: 12px;
}

.collapsible-header.open .chevron { transform: rotate(90deg); }

.collapsible-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease-out;
}

.collapsible-body.open { max-height: 5000px; }
</style>
</head>
<body>

<header>
  <div class="container">
    <h1>Literature Paper Breaker</h1>
    <p>AI-Powered Humanities Research Automation System</p>
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-value" id="totalPapers">3</span>
        <span class="stat-label">Papers Generated</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="totalReviews">9</span>
        <span class="stat-label">Peer Reviews</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="avgScore">--</span>
        <span class="stat-label">Avg Score (R2)</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="totalWords">--</span>
        <span class="stat-label">Total Words</span>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <!-- Pipeline visualization -->
  <div class="pipeline-flow" id="pipelineFlow"></div>

  <!-- Paper cards -->
  <div class="papers-grid" id="papersGrid"></div>

  <!-- Detail panel -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <div>
        <h2 id="detailTitle"></h2>
        <p style="color: var(--text2); font-size: 13px; margin-top: 4px;" id="detailMeta"></p>
      </div>
      <button class="close-btn" onclick="closeDetail()">&times;</button>
    </div>
    <div class="detail-tabs" id="detailTabs"></div>
    <div class="detail-content" id="detailContent"></div>
  </div>
</div>

<script>
// Paper data will be loaded from files
const PAPERS_DATA = [
  {
    id: 1,
    title: "Large Language Models as Cultural Agents: How AI-Generated Text Reshapes Collective Memory and Historical Narratives in the Digital Public Sphere",
    titleShort: "LLMs as Cultural Agents",
    discipline: "Sociology",
    language: "English",
    type: "Research Article",
    targetWords: 8000,
    dir: "paper_1",
    reviewers: [
      { name: "Shoshana Zuboff", affiliation: "Harvard Business School", expertise: "Surveillance Capitalism" },
      { name: "Safiya Umoja Noble", affiliation: "UCLA", expertise: "Algorithmic Bias" },
      { name: "Astrid Erll", affiliation: "Goethe University Frankfurt", expertise: "Memory Studies" }
    ]
  },
  {
    id: 2,
    title: "数字孪生与非物质文化遗产保护：人工智能时代传统手工艺知识图谱的构建与传承路径研究",
    titleShort: "数字孪生与非遗保护",
    discipline: "Anthropology",
    language: "中文",
    type: "Research Article",
    targetWords: 10000,
    dir: "paper_2",
    reviewers: [
      { name: "党安荣", affiliation: "清华大学建筑学院", expertise: "数字孪生与文化遗产" },
      { name: "杨红", affiliation: "中国传媒大学", expertise: "非遗数字化传播" },
      { name: "Chiara Boscaro", affiliation: "Politecnico di Milano", expertise: "Digital Twins" }
    ]
  },
  {
    id: 3,
    title: "The Algorithmic Flaneur: Psychogeography, Attention Economics, and the Phenomenology of AI-Mediated Urban Experience",
    titleShort: "The Algorithmic Flaneur",
    discipline: "Philosophy",
    language: "English",
    type: "Essay",
    targetWords: 7000,
    dir: "paper_3",
    reviewers: [
      { name: "Peter-Paul Verbeek", affiliation: "University of Twente", expertise: "Postphenomenology" },
      { name: "Shannon Mattern", affiliation: "University of Pennsylvania", expertise: "Urban Media" },
      { name: "James Williams", affiliation: "Oxford University", expertise: "Attention Ethics" }
    ]
  }
];

const PIPELINE_STAGES = [
  { name: "Literature Search", icon: "1" },
  { name: "Literature Review", icon: "2" },
  { name: "Gap Analysis", icon: "3" },
  { name: "Research Proposals", icon: "4" },
  { name: "Paper Writing", icon: "5" },
  { name: "Peer Review R1", icon: "6" },
  { name: "Revision", icon: "7" },
  { name: "Peer Review R2", icon: "8" },
];

// File cache
const fileCache = {};

async function loadFile(path) {
  if (fileCache[path]) return fileCache[path];
  try {
    const resp = await fetch(path);
    if (!resp.ok) return null;
    const text = await resp.text();
    fileCache[path] = text;
    return text;
  } catch(e) {
    return null;
  }
}

function getScoreClass(score) {
  if (score >= 7.5) return 'score-good';
  if (score >= 5.5) return 'score-ok';
  return 'score-bad';
}

function getDecisionClass(decision) {
  if (!decision) return '';
  const d = decision.toLowerCase().replace(/\s+/g, '_');
  if (d === 'accept') return 'decision-accept';
  if (d.includes('minor')) return 'decision-minor';
  if (d.includes('major')) return 'decision-major';
  return 'decision-reject';
}

function formatDecision(d) {
  if (!d) return 'Pending';
  return d.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

function countWords(text) {
  if (!text) return 0;
  // Count both English words and Chinese characters
  const english = text.replace(/[\u4e00-\u9fff]/g, '').split(/\s+/).filter(w => w.length > 0).length;
  const chinese = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  return english + chinese;
}

function getBarColor(score) {
  if (score >= 8) return 'var(--green)';
  if (score >= 6) return 'var(--yellow)';
  if (score >= 4) return 'var(--orange)';
  return 'var(--red)';
}

// Parse peer review markdown to extract structured data
function parseReviewMd(text) {
  if (!text) return null;
  const result = {
    reviewers: [],
    synthesis: null,
    raw: text
  };

  // Simple extraction - look for reviewer sections and scores
  const sections = text.split(/(?=##\s+Reviewer|##\s+评审人|##\s+Editor|##\s+编辑)/);

  for (const section of sections) {
    if (section.match(/Reviewer|评审人/i) && !section.match(/^##\s*(Editor|编辑)/i)) {
      const reviewer = parseReviewerSection(section);
      if (reviewer) result.reviewers.push(reviewer);
    }
    if (section.match(/Editor|编辑|Synthesis|综合/i)) {
      result.synthesis = parseSynthesisSection(section);
    }
  }

  return result;
}

function parseReviewerSection(text) {
  const reviewer = {
    name: '',
    affiliation: '',
    scores: [],
    overallScore: 0,
    decision: '',
    strengths: [],
    weaknesses: [],
    comments: '',
    suggestions: []
  };

  // Extract name
  const nameMatch = text.match(/(?:Reviewer|评审人)\s*\d*[：:]\s*(?:Professor\s+|Prof\.\s+)?(.+?)(?:\s*[\(（]|$)/m);
  if (nameMatch) reviewer.name = nameMatch[1].trim();

  // Extract affiliation
  const affilMatch = text.match(/[\(（](.+?)[\)）]/);
  if (affilMatch) reviewer.affiliation = affilMatch[1].trim();

  // Extract scores - look for criterion/score patterns
  const scorePatterns = [
    /\|\s*(.+?)\s*\|\s*(\d+)\s*(?:\/10)?\s*\|\s*(.+?)\s*\|/g,
    /[-*]\s*\*?\*?(.+?)\*?\*?\s*[：:]\s*(\d+)\/10\s*[-—]\s*(.+)/g,
    /(\w[\w\s&]+?)\s*[：:]\s*(\d+)\s*(?:\/10)?/g
  ];

  for (const pattern of scorePatterns) {
    let match;
    while ((match = pattern.exec(text)) !== null) {
      const name = match[1].trim();
      const score = parseInt(match[2]);
      if (score >= 1 && score <= 10 && name.length > 2 && name.length < 40) {
        reviewer.scores.push({
          criterion: name.replace(/\*\*/g, ''),
          score: score,
          comment: match[3] ? match[3].trim() : ''
        });
      }
    }
    if (reviewer.scores.length > 0) break;
  }

  // Calculate overall
  if (reviewer.scores.length > 0) {
    reviewer.overallScore = reviewer.scores.reduce((a, b) => a + b.score, 0) / reviewer.scores.length;
  }

  // Decision
  const decMatch = text.match(/(?:Decision|决定|录用决定|Recommendation)[：:]\s*\**\s*(accept|minor.revision|major.revision|reject|小修|大修|接受|拒稿)/i);
  if (decMatch) reviewer.decision = decMatch[1].trim();

  // Strengths
  const strengthSection = text.match(/(?:Strengths?|优点|优势)[：:]\s*\n([\s\S]*?)(?=\n(?:##|\*\*Weakness|Weakness|不足|缺点|Detailed|详细|Suggestion|建议|Decision|决定))/i);
  if (strengthSection) {
    reviewer.strengths = strengthSection[1].match(/[-*]\s+(.+)/g)?.map(s => s.replace(/^[-*]\s+/, '').trim()) || [];
  }

  // Weaknesses
  const weakSection = text.match(/(?:Weakness|不足|缺点)[es]*[：:]\s*\n([\s\S]*?)(?=\n(?:##|\*\*Detail|Detail|Suggestion|建议|Decision|决定|具体))/i);
  if (weakSection) {
    reviewer.weaknesses = weakSection[1].match(/[-*]\s+(.+)/g)?.map(s => s.replace(/^[-*]\s+/, '').trim()) || [];
  }

  // Suggestions
  const sugSection = text.match(/(?:Suggestions?|建议|修改建议)[：:]\s*\n([\s\S]*?)(?=\n(?:##|$|\*\*Decision|Decision|决定))/i);
  if (sugSection) {
    reviewer.suggestions = sugSection[1].match(/[-*\d.]\s+(.+)/g)?.map(s => s.replace(/^[-*\d.]\s+/, '').trim()) || [];
  }

  // Detailed comments
  const commentSection = text.match(/(?:Detailed|详细)[^：:]*[：:]\s*\n([\s\S]*?)(?=\n(?:##|\*\*Suggestion|Suggestion|建议))/i);
  if (commentSection) reviewer.comments = commentSection[1].trim();

  return reviewer.name ? reviewer : null;
}

function parseSynthesisSection(text) {
  return {
    metaReview: text.replace(/^##.+\n/, '').trim(),
    raw: text
  };
}

// Render functions
function renderPipeline() {
  const container = document.getElementById('pipelineFlow');
  container.innerHTML = PIPELINE_STAGES.map((stage, i) => {
    const isLast = i === PIPELINE_STAGES.length - 1;
    return `
      <div class="pipeline-step completed">
        <span style="font-weight:700;color:var(--green)">${stage.icon}</span>
        ${stage.name}
      </div>
      ${!isLast ? '<span class="pipeline-arrow">&#8594;</span>' : ''}
    `;
  }).join('');
}

function renderPaperCards() {
  const grid = document.getElementById('papersGrid');
  grid.innerHTML = PAPERS_DATA.map(paper => `
    <div class="paper-card" id="card-${paper.id}" onclick="showDetail(${paper.id})">
      <span class="paper-num">PAPER ${paper.id}</span>
      <h3>${paper.title}</h3>
      <div class="paper-meta">
        <span class="meta-tag">${paper.discipline}</span>
        <span class="meta-tag">${paper.language}</span>
        <span class="meta-tag">${paper.type}</span>
        <span class="meta-tag">${paper.targetWords.toLocaleString()} words</span>
      </div>
      <div class="paper-score" id="score-${paper.id}">
        <div class="loading"><div class="spinner"></div>Loading review data...</div>
      </div>
    </div>
  `).join('');
}

async function loadPaperScores() {
  let totalWc = 0;
  let totalAvgR2 = 0;
  let r2Count = 0;

  for (const paper of PAPERS_DATA) {
    const paperText = await loadFile(`output/${paper.dir}/paper.md`);
    const wc = countWords(paperText);
    totalWc += wc;

    const review1 = await loadFile(`output/${paper.dir}/peer_review.md`);
    const review2 = await loadFile(`output/${paper.dir}/peer_review_round2.md`);

    const r1 = parseReviewMd(review1);
    const r2 = parseReviewMd(review2);

    paper._review1 = r1;
    paper._review2 = r2;
    paper._wordCount = wc;
    paper._paperText = paperText;
    paper._revisedText = await loadFile(`output/${paper.dir}/paper_revised.md`);
    paper._litReview = await loadFile(`output/${paper.dir}/literature_review.md`);
    paper._gapAnalysis = await loadFile(`output/${paper.dir}/gap_analysis.md`);
    paper._proposals = await loadFile(`output/${paper.dir}/proposals.md`);

    const scoreEl = document.getElementById(`score-${paper.id}`);

    const r1Score = r1?.reviewers.length > 0
      ? (r1.reviewers.reduce((a,r) => a + r.overallScore, 0) / r1.reviewers.length)
      : null;
    const r2Score = r2?.reviewers.length > 0
      ? (r2.reviewers.reduce((a,r) => a + r.overallScore, 0) / r2.reviewers.length)
      : null;

    const displayScore = r2Score || r1Score || 0;
    const displayDecision = r2?.reviewers[0]?.decision || r1?.reviewers[0]?.decision || 'pending';

    if (r2Score) { totalAvgR2 += r2Score; r2Count++; }

    paper._r1Score = r1Score;
    paper._r2Score = r2Score;
    paper._decision = displayDecision;

    if (displayScore > 0) {
      scoreEl.innerHTML = `
        <div class="score-circle ${getScoreClass(displayScore)}">${displayScore.toFixed(1)}</div>
        <div class="score-details">
          <div class="label">Final Score (Round ${r2Score ? '2' : '1'})</div>
          <div class="decision ${getDecisionClass(displayDecision)}">${formatDecision(displayDecision)}</div>
        </div>
        ${r1Score && r2Score ? `<div class="arrow-improvement">&#9650; +${(r2Score - r1Score).toFixed(1)}</div>` : ''}
      `;
    } else {
      scoreEl.innerHTML = `<div style="color:var(--text2);font-size:13px">No review data available yet</div>`;
    }
  }

  document.getElementById('totalWords').textContent = totalWc > 0 ? (totalWc / 1000).toFixed(1) + 'k' : '--';
  document.getElementById('avgScore').textContent = r2Count > 0 ? (totalAvgR2 / r2Count).toFixed(1) : '--';
}

let currentPaper = null;
let currentTab = 'overview';

function showDetail(paperId) {
  currentPaper = PAPERS_DATA.find(p => p.id === paperId);
  if (!currentPaper) return;

  // Highlight card
  document.querySelectorAll('.paper-card').forEach(c => c.classList.remove('active'));
  document.getElementById(`card-${paperId}`).classList.add('active');

  const panel = document.getElementById('detailPanel');
  panel.classList.add('visible');

  document.getElementById('detailTitle').textContent = currentPaper.titleShort || currentPaper.title;
  document.getElementById('detailMeta').textContent = `${currentPaper.discipline} | ${currentPaper.language} | ${currentPaper.type}`;

  const tabs = ['overview', 'paper', 'review-r1', 'revision', 'review-r2', 'literature', 'gaps', 'proposals'];
  const tabLabels = ['Overview', 'Original Paper', 'Review R1', 'Revised Paper', 'Review R2', 'Lit Review', 'Gap Analysis', 'Proposals'];

  document.getElementById('detailTabs').innerHTML = tabs.map((t, i) =>
    `<button class="detail-tab ${t === 'overview' ? 'active' : ''}" onclick="switchTab('${t}')">${tabLabels[i]}</button>`
  ).join('');

  switchTab('overview');
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('visible');
  document.querySelectorAll('.paper-card').forEach(c => c.classList.remove('active'));
  currentPaper = null;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.detail-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.detail-tab').forEach(t => {
    if (t.textContent.toLowerCase().replace(/\s+/g, '-').replace('r1', 'review-r1').replace('r2', 'review-r2') === tab
        || (tab === 'overview' && t.textContent === 'Overview')
        || (tab === 'paper' && t.textContent === 'Original Paper')
        || (tab === 'review-r1' && t.textContent === 'Review R1')
        || (tab === 'revision' && t.textContent === 'Revised Paper')
        || (tab === 'review-r2' && t.textContent === 'Review R2')
        || (tab === 'literature' && t.textContent === 'Lit Review')
        || (tab === 'gaps' && t.textContent === 'Gap Analysis')
        || (tab === 'proposals' && t.textContent === 'Proposals')
    ) {
      t.classList.add('active');
    }
  });

  const content = document.getElementById('detailContent');

  switch(tab) {
    case 'overview': renderOverview(content); break;
    case 'paper': renderMarkdown(content, currentPaper._paperText); break;
    case 'review-r1': renderReview(content, currentPaper._review1, 1); break;
    case 'revision': renderMarkdown(content, currentPaper._revisedText); break;
    case 'review-r2': renderReview(content, currentPaper._review2, 2); break;
    case 'literature': renderMarkdown(content, currentPaper._litReview); break;
    case 'gaps': renderMarkdown(content, currentPaper._gapAnalysis); break;
    case 'proposals': renderMarkdown(content, currentPaper._proposals); break;
  }
}

function renderOverview(container) {
  const p = currentPaper;
  const r1 = p._review1;
  const r2 = p._review2;

  let html = '<h3 style="margin-bottom:16px">Score Comparison</h3>';

  html += '<div class="score-comparison">';
  if (p._r1Score) {
    html += `<div class="compare-card">
      <div class="round-label">Round 1</div>
      <div class="round-score" style="color:${getBarColor(p._r1Score)}">${p._r1Score.toFixed(1)}</div>
      <div class="round-decision ${getDecisionClass(r1?.reviewers[0]?.decision)}">${formatDecision(r1?.reviewers[0]?.decision)}</div>
    </div>`;
  }
  if (p._r1Score && p._r2Score) {
    html += `<div class="compare-card" style="display:flex;align-items:center;justify-content:center">
      <div>
        <div style="font-size:32px;color:var(--green)">&#8594;</div>
        <div class="arrow-improvement">+${(p._r2Score - p._r1Score).toFixed(1)}</div>
      </div>
    </div>`;
  }
  if (p._r2Score) {
    html += `<div class="compare-card">
      <div class="round-label">Round 2</div>
      <div class="round-score" style="color:${getBarColor(p._r2Score)}">${p._r2Score.toFixed(1)}</div>
      <div class="round-decision ${getDecisionClass(r2?.reviewers[0]?.decision)}">${formatDecision(r2?.reviewers[0]?.decision)}</div>
    </div>`;
  }
  html += '</div>';

  // Reviewers overview
  html += '<h3 style="margin:24px 0 16px">Reviewers</h3>';
  html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px">';
  for (const rev of p.reviewers) {
    const r1r = r1?.reviewers.find(r => r.name.includes(rev.name.split(' ').pop()));
    const r2r = r2?.reviewers.find(r => r.name.includes(rev.name.split(' ').pop()));
    html += `<div style="background:var(--surface2);padding:16px;border-radius:12px;border:1px solid var(--border)">
      <div style="font-weight:600;font-size:14px">${rev.name}</div>
      <div style="font-size:12px;color:var(--text2);margin:4px 0">${rev.affiliation}</div>
      <div style="font-size:11px;color:var(--accent2)">${rev.expertise}</div>
      <div style="margin-top:8px;display:flex;gap:8px">
        ${r1r ? `<span style="font-size:12px;background:var(--bg);padding:2px 8px;border-radius:4px">R1: ${r1r.overallScore.toFixed(1)}</span>` : ''}
        ${r2r ? `<span style="font-size:12px;background:var(--bg);padding:2px 8px;border-radius:4px;color:var(--green)">R2: ${r2r.overallScore.toFixed(1)}</span>` : ''}
      </div>
    </div>`;
  }
  html += '</div>';

  // Word count
  html += `<div style="margin-top:24px;padding:16px;background:var(--surface2);border-radius:12px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="color:var(--text2)">Word Count</span>
      <span style="font-weight:700;font-size:18px">${p._wordCount.toLocaleString()} / ${p.targetWords.toLocaleString()}</span>
    </div>
    <div style="margin-top:8px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden">
      <div style="height:100%;width:${Math.min(100, (p._wordCount/p.targetWords)*100)}%;background:var(--accent);border-radius:3px"></div>
    </div>
  </div>`;

  container.innerHTML = html;
}

function renderReview(container, reviewData, round) {
  if (!reviewData || reviewData.reviewers.length === 0) {
    container.innerHTML = `<div style="text-align:center;color:var(--text2);padding:40px">
      <p>No review data available for Round ${round}.</p>
      <p style="font-size:13px;margin-top:8px">Review files may still be generating.</p>
    </div>`;
    return;
  }

  let html = `<div class="review-timeline">`;

  for (const reviewer of reviewData.reviewers) {
    html += `
    <div class="timeline-item">
      <div class="timeline-dot ${round === 2 ? 'round2' : ''}"></div>
      <div class="timeline-label">Round ${round} Review</div>
      <div class="reviewer-card">
        <div class="reviewer-header">
          <div>
            <div class="reviewer-name">${reviewer.name}</div>
            <div class="reviewer-affil">${reviewer.affiliation}</div>
          </div>
          <div class="reviewer-score-badge" style="background:${getBarColor(reviewer.overallScore)}20;color:${getBarColor(reviewer.overallScore)}">
            ${reviewer.overallScore.toFixed(1)}
          </div>
        </div>

        ${reviewer.scores.length > 0 ? `
        <div class="criteria-scores">
          ${reviewer.scores.slice(0, 7).map(s => `
            <div class="criterion">
              <span class="criterion-name">${s.criterion}</span>
              <div class="criterion-bar-bg">
                <div class="criterion-bar" style="width:${s.score * 10}%;background:${getBarColor(s.score)}"></div>
              </div>
              <span class="criterion-val" style="color:${getBarColor(s.score)}">${s.score}</span>
            </div>
          `).join('')}
        </div>` : ''}

        <div class="comments-section">
          ${reviewer.strengths.length > 0 ? `
          <div class="comment-block">
            <div class="comment-label">Strengths</div>
            <ul class="comment-list strengths">
              ${reviewer.strengths.slice(0, 4).map(s => `<li>${s}</li>`).join('')}
            </ul>
          </div>` : ''}

          ${reviewer.weaknesses.length > 0 ? `
          <div class="comment-block">
            <div class="comment-label">Weaknesses</div>
            <ul class="comment-list weaknesses">
              ${reviewer.weaknesses.slice(0, 4).map(w => `<li>${w}</li>`).join('')}
            </ul>
          </div>` : ''}

          ${reviewer.comments ? `
          <div class="comment-block">
            <div class="comment-label">Detailed Comments</div>
            <div class="comment-text">${reviewer.comments.substring(0, 800)}${reviewer.comments.length > 800 ? '...' : ''}</div>
          </div>` : ''}

          ${reviewer.suggestions.length > 0 ? `
          <div class="comment-block">
            <div class="comment-label">Suggestions</div>
            <ul class="comment-list suggestions">
              ${reviewer.suggestions.slice(0, 5).map(s => `<li>${s}</li>`).join('')}
            </ul>
          </div>` : ''}

          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
            <span class="decision ${getDecisionClass(reviewer.decision)}" style="font-weight:600">
              Decision: ${formatDecision(reviewer.decision)}
            </span>
          </div>
        </div>
      </div>
    </div>`;
  }

  // Editor synthesis
  if (reviewData.synthesis) {
    html += `
    <div class="timeline-item">
      <div class="timeline-dot revision"></div>
      <div class="timeline-label">Editor Synthesis</div>
      <div class="editor-card">
        <h4>Editor-in-Chief Meta-Review</h4>
        <div class="comment-text">${reviewData.synthesis.metaReview.substring(0, 1200)}</div>
      </div>
    </div>`;
  }

  html += '</div>';
  container.innerHTML = html;
}

function renderMarkdown(container, text) {
  if (!text) {
    container.innerHTML = '<div style="text-align:center;color:var(--text2);padding:40px">File not available yet.</div>';
    return;
  }

  // Simple markdown rendering
  let html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^[-*] (.+)$/gm, '<li style="margin-left:16px;list-style:disc">$1</li>')
    .replace(/^\d+\. (.+)$/gm, '<li style="margin-left:16px;list-style:decimal">$1</li>')
    .replace(/^---$/gm, '<hr style="border:none;border-top:1px solid var(--border);margin:20px 0">')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');

  container.innerHTML = `<div class="paper-content"><p>${html}</p></div>`;
}

// Initialize
async function init() {
  renderPipeline();
  renderPaperCards();
  await loadPaperScores();
}

init();

// Auto-refresh every 30s to pick up new review files
setInterval(async () => {
  // Clear cache to pick up new files
  for (const key in fileCache) delete fileCache[key];
  await loadPaperScores();
}, 30000);
</script>
