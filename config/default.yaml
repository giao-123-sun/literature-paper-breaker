# Literature Paper Breaker - Default Configuration
# Copy this file to config/local.yaml and customize

# Research settings
research:
  depth: standard          # quick, standard, deep
  max_papers: 50
  language: en             # en, zh, fr, de, es, ja, ko
  discipline_type: social_science  # humanities or social_science

# LLM settings
llm:
  provider: anthropic      # anthropic, openai, or openrouter
  model: claude-sonnet-4-20250514  # or gpt-4o, deepseek/deepseek-chat, etc.
  temperature: 0.3
  max_tokens: 8192

# Multi-model strategy (for OpenRouter)
# Use different models for different task tiers:
#   - primary: core writing tasks (literature review, paper writing, peer review)
#   - lite: simple tasks (classification, keyword extraction, formatting)
#   - image: image generation (pipeline diagrams, infographics, social media)
models:
  primary: deepseek/deepseek-chat              # Best value: ~$0.05/paper
  lite: google/gemini-3.1-flash-lite-preview   # Cheapest: classification, summaries
  image: google/gemini-3.1-flash-image-preview # Nano Banana 2: Pro-level image gen

# Data sources to enable
sources:
  - openalex               # Free, comprehensive (recommended)
  - semantic_scholar        # Free, good citation graph
  - crossref               # Free, DOI resolution
  # - core                 # Requires API key from core.ac.uk
  # - ctext                # Chinese classical texts

# Peer review simulation
peer_review:
  enabled: false             # Enable simulated peer review after writing
  num_reviewers: 3           # Number of reviewer personas (real scholars)
  review_rounds: 1           # Review-revise cycles (1-3 recommended)

# Paper output settings
paper:
  type: research_article   # research_article, review, essay, commentary
  target_words: 8000
  format: markdown         # markdown or latex
  citation_style: apa      # apa or chicago

# Output directory
output_dir: output
